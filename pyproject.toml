[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-vividai"
version = "0.1.2"
description = "Persistent, explicit-generation VividAI nodes for ComfyUI"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.28.1,<0.29", "Pillow>=11", "numpy>=1.25", "av>=17"]

[project.urls]
Repository = "https://github.com/Neko1t/ComfyUI-plugin"

[tool.comfy]
PublisherId = "neko1t"
DisplayName = "ComfyUI VividAI"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "aiohttp>=3.11"]

[tool.setuptools.packages.find]
include = ["vividai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
